version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: bun
    directories: ["/", "/container"]
    schedule: { interval: weekly }
    # Let a release sit for a week before Dependabot proposes it. GitHub
    # Actions has no cooldown support, so it only applies to bun.
    cooldown:
      default-days: 7
