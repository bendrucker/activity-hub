name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run format:check
      - run: bun run types
      - name: worker-configuration.d.ts is current
        run: |
          git diff --exit-code -- worker-configuration.d.ts \
            || { echo '::error::wrangler.jsonc changed without `bun run types`'; exit 1; }
      - uses: j178/prek-action@v3
        env:
          SKIP: no-commit-to-branch

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # The container has its own dependency set and tsconfig: it runs under
      # Bun with DuckDB and an S3 client, none of which the Workers build sees.
      - run: bun install --frozen-lockfile
        working-directory: container
      # The typecheck reaches up into src/import, and module resolution walks
      # up from there to the repository root rather than into container/. The
      # image gets the same effect by putting both under one /app root.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        working-directory: container
      - run: bun test
        working-directory: container

  container-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changed
        with:
          filters: |
            image:
              - 'container/**'
              - 'src/import/**'
              - 'src/transform/protocol.ts'
      - if: steps.changed.outputs.image == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.changed.outputs.image == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [check, container, container-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply D1 migrations
        run: bun run wrangler d1 migrations apply activity-hub-registry --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy worker
        run: bun run wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
