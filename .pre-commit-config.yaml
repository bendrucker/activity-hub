repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.65.0
    hooks: [{ id: oxfmt }]
